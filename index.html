<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロボット掃除機性能検証：データ収集システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500&display=swap');
:root{--ui-blue:#2b5797;--bg-gray:#f4f4f4;--border-gray:#d1d1d1;--secret-gold:#b2944b;}
body{background-color:var(--bg-gray);color:#333;font-family:'Noto Sans JP',sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent;}
.report-card{background:#fff;border:1px solid var(--border-gray);border-radius:0;box-shadow:2px 2px 0 rgba(0,0,0,0.05);}
.header-stripe{height:4px;background-color:var(--ui-blue);margin-bottom:2rem;}
.section-title{border-left:4px solid var(--ui-blue);padding-left:.75rem;font-weight:bold;font-size:.9rem;margin-bottom:1.5rem;color:var(--ui-blue);}
.secret-title{border-left:4px solid var(--secret-gold);color:var(--secret-gold);}
.input-field{background:#fafafa!important;border:1px solid var(--border-gray)!important;font-size:.85rem!important;}
.btn-submit{background:var(--ui-blue);color:#fff;font-weight:bold;width:100%;padding:.75rem;border:none;cursor:pointer;transition:.2s;}
.btn-secret{background:var(--secret-gold);}
.data-label{font-size:.7rem;color:#777;margin-bottom:.25rem;font-weight:bold;display:block;}
.approval-label{color:#000;}
.hidden-section{display:none;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(2px);z-index:100;align-items:center;justify-content:center;padding:10px;}
.modal-content{background:white;padding:1rem;max-width:750px;width:100%;border:1px solid #000;}
.confirm-table{width:100%;border-collapse:collapse;font-size:.7rem;margin-bottom:1rem;table-layout:fixed;}
.confirm-table th{background:#f0f0f0;padding:6px;border:1px solid #ddd;width:100px;color:#555;text-align:center;}
.confirm-table td{padding:6px;border:1px solid #ddd;font-weight:bold;vertical-align:top;word-break:break-all;}
.val-col{width:140px;background:#fff;text-align:center;}
.reason-col{background:#fafafa;}
.confirm-val-black{color:#000;}
.msg-box{padding:1rem;margin-top:1rem;font-size:.8rem;font-weight:bold;display:none;text-align:center;border:1px solid transparent;}
.msg-success{background:#f0fdf4;color:#166534;border-color:#22c55e;}
.msg-error{background:#fef2f2;color:#991b1b;border-color:#ef4444;font-family:'Roboto Mono',monospace;}
.q-text{font-size:.75rem;font-weight:bold;margin-bottom:.5rem;color:#1e293b;}
</style>
</head>

<body class="p-4 md:p-12">
<div class="max-w-3xl mx-auto">
<div class="header-stripe"></div>

<header class="mb-8">
<h1 class="text-lg font-bold tracking-tight mb-1">ロボット掃除機 性能評価システム</h1>
</header>

<section class="report-card p-6">
<h2 class="section-title uppercase tracking-widest">01. 現場評価アンケート</h2>
<form id="surveyForm" class="space-y-6">

<div class="pb-6 border-b border-dashed border-slate-200">
<p class="q-text">Q1. ロボット掃除機の導入に賛成ですか？</p>
<label class="data-label approval-label">導入賛否</label>
<select id="approval" class="w-full p-2 input-field font-bold text-black">
<option value="5">5: 非常に賛成</option>
<option value="4">4: 賛成</option>
<option value="3" selected>3: 普通</option>
<option value="2">2: 反対</option>
<option value="1">1: 非常に反対</option>
</select>
<label class="data-label mt-3">上記入力内容の理由</label>
<textarea id="approval_reason" class="w-full p-2 input-field h-16"></textarea>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-6 border-b border-dashed border-slate-200">
<div>
<p class="q-text">Q2. 清掃性能に満足していますか？</p>
<label class="data-label">清掃満足度</label>
<select id="rating" class="w-full p-2 input-field font-bold">
<option value="5">5: 非常に満足</option>
<option value="4">4: 満足</option>
<option value="3" selected>3: 普通</option>
<option value="2">2: 不満</option>
<option value="1">1: 非常に不満</option>
</select>
<label class="data-label mt-3">清掃クオリティへの意見</label>
<textarea id="comment" class="w-full p-2 input-field h-24"></textarea>
</div>

<div>
<p class="q-text">Q3. 稼働中の音や動きは業務の妨げになりませんか？</p>
<label class="data-label">業務への影響</label>
<select id="interference" class="w-full p-2 input-field font-bold">
<option value="5">5: 非常に気にならない</option>
<option value="4">4: 気にならない</option>
<option value="3" selected>3: 普通</option>
<option value="2">2: 邪魔</option>
<option value="1">1: 非常に邪魔</option>
</select>
<label class="data-label mt-3">稼働中の音や動きについて</label>
<textarea id="interference_detail" class="w-full p-2 input-field h-24"></textarea>
</div>
</div>

<div class="pb-6">
<p class="q-text">Q4. 掃除当番の負担は軽減され、休み時間は快適になりましたか？</p>
<label class="data-label">休み時間の快適度</label>
<select id="break_comfort" class="w-full p-2 input-field font-bold">
<option value="5">5: 非常に快適になった</option>
<option value="4">4: 快適になった</option>
<option value="3" selected>3: 変わらない</option>
<option value="2">2: 不便になった</option>
<option value="1">1: 非常に不便になった</option>
</select>
<label class="data-label mt-3">上記入力内容の理由</label>
<textarea id="break_comfort_reason" class="w-full p-2 input-field h-16"></textarea>
</div>

<button type="button" onclick="openConfirmModal('survey')" class="btn-submit text-xs uppercase tracking-widest">内容を確認する</button>
<div id="surveyMsg" class="msg-box"></div>

</form>
</section>
</div>

<script>
const SUPABASE_URL='https://speopkpxkpmspuxjgyde.supabase.co';
const SUPABASE_KEY='YOUR_KEY';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentPayload=null;

function openConfirmModal(){
const getT=id=>{const e=document.getElementById(id);return e.options[e.selectedIndex].text;}
const getV=id=>document.getElementById(id).value||"(未記入)";
currentPayload={
approval:parseInt(document.getElementById('approval').value),
approval_reason:getV('approval_reason'),
rating:parseInt(document.getElementById('rating').value),
comment:getV('comment'),
interference:parseInt(document.getElementById('interference').value),
interference_detail:getV('interference_detail'),
approval_detail:`BreakComfort: ${getT('break_comfort')} | Reason: ${getV('break_comfort_reason')}`
};
alert("確認OKなら送信処理へ進んでください");
}
</script>

</body>
</html>
