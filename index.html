<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルンバアンケート</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500&display=swap');
:root{
--ui-blue:#2b5797;
--bg-gray:#f4f4f4;
--border-gray:#d1d1d1;
--secret-gold:#b2944b;
}
body{
background-color:var(--bg-gray);
color:#333;
font-family:'Noto Sans JP',sans-serif;
line-height:1.6;
-webkit-tap-highlight-color:transparent;
}
.report-card{
background:#fff;
border:1px solid var(--border-gray);
box-shadow:2px 2px 0 rgba(0,0,0,0.05);
}
.header-stripe{height:4px;background:var(--ui-blue);margin-bottom:2rem;}
.section-title{
border-left:4px solid var(--ui-blue);
padding-left:.75rem;
font-weight:bold;
font-size:.9rem;
margin-bottom:1.5rem;
color:var(--ui-blue);
}
.input-field{
background:#fafafa!important;
border:1px solid var(--border-gray)!important;
font-size:.85rem!important;
}
.btn-submit{
background:var(--ui-blue);
color:#fff;
font-weight:bold;
width:100%;
padding:.75rem;
border:none;
cursor:pointer;
}
.data-label{
font-size:.7rem;
color:#777;
margin-bottom:.25rem;
font-weight:bold;
display:block;
}
.msg-box{
padding:1rem;
margin-top:1rem;
font-size:.8rem;
font-weight:bold;
display:none;
text-align:center;
border:1px solid transparent;
}
.msg-success{background:#f0fdf4;color:#166534;border-color:#22c55e;}
.msg-error{background:#fef2f2;color:#991b1b;border-color:#ef4444;}
</style>
</head>
<body class="p-4 md:p-12">

<div class="max-w-3xl mx-auto">
<div class="header-stripe"></div>

<h1 class="text-lg font-bold mb-6">ルンバアンケート</h1>

<form id="surveyForm" class="space-y-6">

<div>
<label class="data-label">導入に賛成ですか</label>
<select id="approval" class="w-full p-2 input-field">
<option value="5">5 非常に賛成</option>
<option value="4">4 賛成</option>
<option value="3" selected>3 普通</option>
<option value="2">2 反対</option>
<option value="1">1 非常に反対</option>
</select>
<textarea id="approval_reason" class="w-full p-2 input-field mt-2" placeholder="理由"></textarea>
</div>

<div>
<label class="data-label">清掃満足度</label>
<select id="rating" class="w-full p-2 input-field">
<option value="5">5 非常に満足</option>
<option value="4">4 満足</option>
<option value="3" selected>3 普通</option>
<option value="2">2 不満</option>
<option value="1">1 非常に不満</option>
</select>
<textarea id="comment" class="w-full p-2 input-field mt-2" placeholder="理由"></textarea>
</div>

<div>
<label class="data-label">その他ご意見</label>
<textarea id="other_comment" class="w-full p-2 input-field" placeholder="椅子を上げるのが面倒など"></textarea>
</div>

<button type="button" onclick="submitSurvey()" class="btn-submit">送信</button>
<div id="surveyMsg" class="msg-box"></div>

</form>
</div>

<script>
const SUPABASE_URL='https://speopkpxkpmspuxjgyde.supabase.co';
const SUPABASE_KEY='YOUR_PUBLIC_KEY';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function submitSurvey(){
const payload={
approval:parseInt(document.getElementById('approval').value),
approval_reason:document.getElementById('approval_reason').value,
rating:parseInt(document.getElementById('rating').value),
comment:document.getElementById('comment').value,
other_comment:document.getElementById('other_comment').value
};

const msg=document.getElementById('surveyMsg');

const {error}=await supabaseClient.from('surveys').insert([payload]);

if(!error){
msg.innerText="✓ 記録されました";
msg.className="msg-box msg-success";
msg.style.display="block";
document.getElementById('surveyForm').reset();
}else{
msg.innerText="DATABASE ERROR";
msg.className="msg-box msg-error";
msg.style.display="block";
}
}
</script>

</body>
</html>
